<header class="nav" [class.is-scrolled]="scrolled" [class.is-hidden]="hidden" [class.is-open]="menuOpen">
  <div class="nav__bar wrap">
    <a class="brand" appLink="/" aria-label="Louell Grey Miones — home">
      <span class="brand__mark">LG</span>
      <span class="brand__name">Louell Grey Miones</span>
    </a>

    <nav class="nav__links" aria-label="Primary">
      <a
        *ngFor="let link of links; let i = index"
        class="nav__link"
        [class.is-active]="isActive(link.path)"
        [attr.aria-current]="isActive(link.path) ? 'page' : null"
        [appLink]="link.path"
      >
        <span class="nav__num">0{{ i + 1 }}</span>
        <span class="nav__text" [attr.data-text]="link.label">{{ link.label }}</span>
      </a>
    </nav>

    <div class="nav__tools">
      <span class="nav__clock label" title="Local time in Cebu, Philippines">
        <span class="pulse" aria-hidden="true"></span>CEB {{ time }}
      </span>

      <button
        type="button"
        class="theme-toggle"
        (click)="toggleTheme($event)"
        [attr.aria-label]="theme.current === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle class="theme-toggle__sun" cx="12" cy="12" r="5" />
          <path
            class="theme-toggle__rays"
            d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"
          />
          <circle class="theme-toggle__moon" cx="17" cy="7" r="5" />
        </svg>
      </button>

      <a class="btn btn--solid btn--sm nav__cta" appLink="/contact" appMagnetic [magnetStrength]="0.25">
        <span class="btn__label">Let’s talk</span>
      </a>

      <button
        type="button"
        class="menu-btn"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen"
        aria-controls="mobile-menu"
      >
        <span class="menu-btn__label">{{ menuOpen ? 'Close' : 'Menu' }}</span>
        <span class="menu-btn__icon" aria-hidden="true"><i></i><i></i></span>
      </button>
    </div>
  </div>
</header>

<div id="mobile-menu" #menu class="menu" [class.is-open]="menuOpen" [attr.aria-hidden]="!menuOpen">
    <nav class="menu__links wrap" aria-label="Mobile">
      <a
        *ngFor="let link of links; let i = index"
        class="menu__link"
        data-menu-item
        [class.is-active]="isActive(link.path)"
        [attr.href]="link.path"
        [attr.tabindex]="menuOpen ? 0 : -1"
        (click)="$event.preventDefault(); go(link.path)"
      >
        <span class="label">0{{ i + 1 }}</span>{{ link.label }}
      </a>
    </nav>
    <div class="menu__foot wrap" data-menu-item>
      <a class="ulink" [href]="'mailto:' + profile.email" [attr.tabindex]="menuOpen ? 0 : -1">{{ profile.email }}</a>
      <span class="label">{{ profile.location }} · {{ time }}</span>
    </div>
</div>
